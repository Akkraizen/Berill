# ./gradlew :server:buildFatJar
# cd server && cp .env.example .env && отредактируйте .env
# docker compose up -d --build
# docker compose run --rm server token create your-user --name token-name
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tessera
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - tessera-db:/var/lib/postgresql/data

  server:
    build: .
    restart: unless-stopped
    depends_on: [ db ]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/tessera
      DATABASE_USER: tessera
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      HUB_TOKENS: ${HUB_TOKENS}
    ports:
      - "8080:8080"

volumes:
  tessera-db:
