name: Publish update

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, e.g. v1.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: updates
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download release files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $TAG" >&2
            exit 1
          fi
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "Berill-$version-android.apk" \
            --pattern "Berill-$version-*.exe" \
            --pattern SHA256SUMS.txt
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "Berill-$version-macos.dmg" || echo "No macOS build in $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "Berill-$version-linux.deb" || echo "No Linux deb build in $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "Berill-$version-linux.rpm" || echo "No Linux rpm build in $TAG"
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS.txt)
          test -f "dist/Berill-$version-android.apk"
          windows="Berill-$version-windows.exe"
          if [ ! -f "dist/$windows" ]; then windows="Berill-$version-Setup.exe"; fi
          test -f "dist/$windows"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "dist/Berill-$version-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign packages for the in-app updater
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set: clients with a built-in update key will refuse this release"
            exit 0
          fi
          bash scripts/release/sign-update.sh dist "$VERSION"
      - uses: ./.github/actions/ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
      - name: Upload to the update server
        env:
          VERSION: ${{ steps.files.outputs.version }}
          WINDOWS_FILE: ${{ steps.files.outputs.windows }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/berill' }}
          KEEP: ${{ vars.RELEASES_KEEP || '3' }}
        run: |
          set -euo pipefail
          ssh deploy "rm -rf '$DEPLOY_PATH/releases/.incoming' && mkdir -p '$DEPLOY_PATH/releases/.incoming'"
          files=("dist/Berill-$VERSION-android.apk" "dist/$WINDOWS_FILE" "dist/Berill-$VERSION-notes.md")
          if [ -f "dist/Berill-$VERSION-macos.dmg" ]; then files+=("dist/Berill-$VERSION-macos.dmg"); fi
          if [ -f "dist/Berill-$VERSION-linux.deb" ]; then files+=("dist/Berill-$VERSION-linux.deb"); fi
          if [ -f "dist/Berill-$VERSION-linux.rpm" ]; then files+=("dist/Berill-$VERSION-linux.rpm"); fi
          if [ -f "dist/Berill-$VERSION-signatures.json" ]; then files+=("dist/Berill-$VERSION-signatures.json"); fi
          scp "${files[@]}" "deploy:$DEPLOY_PATH/releases/.incoming/"
          ssh deploy "KEEP='$KEEP' bash -s -- '$DEPLOY_PATH/releases'" < scripts/deploy/publish-release.sh
          echo "### Update $VERSION published" >> "$GITHUB_STEP_SUMMARY"
      - name: Check download
        if: vars.UPDATES_URL != ''
        env:
          UPDATES_URL: ${{ vars.UPDATES_URL }}
          VERSION: ${{ steps.files.outputs.version }}
          WINDOWS_FILE: ${{ steps.files.outputs.windows }}
        run: curl -fsS -o /dev/null "$UPDATES_URL/download/Berill-$VERSION-android.apk"
