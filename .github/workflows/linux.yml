name: Linux

on:
  push:
    branches: [ master, main ]
    paths:
      - 'app/**'
      - 'core/**'
      - 'core-api/**'
      - 'plugin-sdk/**'
      - 'plugins/**'
      - 'protocol/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'scripts/linux/**'
      - 'version.properties'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'core-api/**'
      - 'plugin-sdk/**'
      - 'plugins/**'
      - 'protocol/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BERILL_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      BERILL_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm
      - name: Test and build Linux packages
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:desktopApp:test :app:desktopApp:packageReleaseDeb :app:desktopApp:packageReleaseRpm --no-configuration-cache --console=plain
          version=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
          mkdir -p "$RUNNER_TEMP/linux"
          cp app/desktopApp/build/compose/binaries/main-release/deb/*.deb "$RUNNER_TEMP/linux/Berill-$version-linux.deb"
          cp app/desktopApp/build/compose/binaries/main-release/rpm/*.rpm "$RUNNER_TEMP/linux/Berill-$version-linux.rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: ${{ runner.temp }}/linux/
          if-no-files-found: error
          retention-days: 14
